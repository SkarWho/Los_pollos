name: CI — Lint & Syntax Check

on:
  push:
    branches:
      - DEV
      - main
  pull_request:
    branches:
      - PROD
      - main

jobs:
  # ──────────────────────────────────────────
  # 1. ShellCheck — scripts Bash
  # ──────────────────────────────────────────
  shellcheck:
    name: ShellCheck (Bash)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Linter les scripts .sh
        run: |
          echo "=== Scripts analysés ==="
          find Scripts/ -name "*.sh" | tee /dev/stderr | xargs shellcheck \
            --severity=warning \
            --shell=bash

  # ──────────────────────────────────────────
  # 2. Bash dry-run — vérification syntaxe sans exécution
  # ──────────────────────────────────────────
  bash-syntax:
    name: Bash Syntax (dry-run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe Bash (bash -n)
        run: |
          EXIT_CODE=0
          for script in Scripts/*.sh; do
            echo -n "Checking $script ... "
            if bash -n "$script"; then
              echo "OK"
            else
              echo "ECHEC"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

  # ──────────────────────────────────────────
  # 3. PSScriptAnalyzer — scripts PowerShell
  # ──────────────────────────────────────────
  psscriptanalyzer:
    name: PSScriptAnalyzer (PowerShell)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyser les scripts .ps1
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "Scripts\" -Filter "*.ps1"
          $results = $scripts | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error
          }

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Host "::error::PSScriptAnalyzer a trouvé $($results.Count) problème(s)."
            exit 1
          } else {
            Write-Host "Aucun problème détecté."
          }

  # ──────────────────────────────────────────
  # 4. PowerShell syntax check (Parse)
  # ──────────────────────────────────────────
  ps-syntax:
    name: PowerShell Syntax (dry-run)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe PowerShell
        shell: pwsh
        run: |
          $exitCode = 0
          Get-ChildItem -Path "Scripts\" -Filter "*.ps1" | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.Name)::$($errors.Count) erreur(s) de syntaxe"
              $errors | ForEach-Object { Write-Host "  $_" }
              $exitCode = 1
            } else {
              Write-Host "$($_.Name) — OK"
            }
          }
          exit $exitCode
